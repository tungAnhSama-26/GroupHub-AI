version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grouphub_db
    environment:
      POSTGRES_USER: grouphub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: grouphub_db
    ports:
      - "5435:5432"
    volumes:
      - grouphub_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: grouphub_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  grouphub_db_data:

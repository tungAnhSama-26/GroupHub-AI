version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: grouphub_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grouphub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-grouphub_db}
    ports:
      - "127.0.0.1:5432:5432" # Only expose to localhost for security
    volumes:
      - grouphub_db_data_prod:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: grouphub_redis_prod
    ports:
      - "127.0.0.1:6379:6379" # Only expose to localhost
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grouphub_api_prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - db
      - redis
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: grouphub_web_prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
      - redis
    restart: always

volumes:
  grouphub_db_data_prod:
